name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      testpypi:
        description: Publish both packages to TestPyPI (requires unique pre-release versions)
        type: boolean
        default: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.created == true && github.event.deleted == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python and uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
          version: "0.12.9"
          enable-cache: false

      - name: Verify the release version
        run: |
          uv run --locked python - <<'PY'
          import ast
          import os
          from pathlib import Path
          import re
          import tomllib

          PACKAGES = {
              "orchestrated-codex": (Path("pyproject.toml"), Path("src/codex_orchestrator/__init__.py")),
              "orchestrated-claude": (
                  Path("packages/orchestrated-claude/pyproject.toml"),
                  Path("packages/orchestrated-claude/src/claude_orchestrator/__init__.py"),
              ),
          }

          def module_version(path):
              tree = ast.parse(path.read_text(), filename=str(path))
              versions = []
              for node in tree.body:
                  if not isinstance(node, ast.Assign):
                      continue
                  if any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets):
                      if not isinstance(node.value, ast.Constant) or not isinstance(node.value.value, str):
                          raise SystemExit(f"{path}: __version__ must be a string literal")
                      versions.append(node.value.value)
              if len(versions) != 1:
                  raise SystemExit(f"{path}: expected exactly one literal __version__ assignment")
              return versions[0]

          found = {}
          for name, (pyproject, module) in PACKAGES.items():
              with pyproject.open("rb") as file:
                  found[f"{name} project"] = tomllib.load(file)["project"]["version"]
              found[f"{name} module"] = module_version(module)
          if os.environ["GITHUB_EVENT_NAME"] == "push":
              tag = os.environ["GITHUB_REF_NAME"]
              match = re.fullmatch(r"v([0-9]+\.[0-9]+\.[0-9]+)", tag)
              if match is None:
                  raise SystemExit(f"invalid release tag: {tag!r}; expected vX.Y.Z")
              found["tag"] = match.group(1)
          if len(set(found.values())) != 1:
              raise SystemExit(f"release version mismatch: {found}")
          print(f"release version verified: {next(iter(found.values()))} ({', '.join(found)})")
          PY

      - name: Verify generated resources are current
        run: uv run --locked scripts/render_resources.py --check

      - name: Run tests
        run: uv run --locked python -m unittest discover -s tests

      - name: Build distributions
        run: |
          uv build --no-sources --out-dir dist/codex
          uv build --no-sources --out-dir dist/claude packages/orchestrated-claude
          rm -f dist/codex/.gitignore dist/claude/.gitignore

      - name: Verify distribution artifacts
        id: distributions
        run: |
          uv run --locked python - <<'PY'
          import os
          from pathlib import Path

          outputs = {}
          for package in ("codex", "claude"):
              files = sorted(path for path in Path("dist", package).iterdir() if path.is_file())
              wheels = [path for path in files if path.name.endswith(".whl")]
              sdists = [path for path in files if path.name.endswith(".tar.gz")]
              if len(files) != 2 or len(wheels) != 1 or len(sdists) != 1:
                  names = [path.name for path in files]
                  raise SystemExit(f"{package}: expected exactly one wheel and one source archive; found {names}")
              outputs[f"{package}_wheel"] = wheels[0]
              outputs[f"{package}_sdist"] = sdists[0]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for key, path in outputs.items():
                  output.write(f"{key}={path}\n")
          print("verified distributions: " + ", ".join(path.name for path in outputs.values()))
          PY

      - name: Smoke test the Codex wheel
        env:
          HOME: ${{ runner.temp }}/smoke-codex-wheel/home
          CODEX_HOME: ${{ runner.temp }}/smoke-codex-wheel/codex-home
          UV_CACHE_DIR: ${{ runner.temp }}/smoke-codex-wheel/uv-cache
          DISTRIBUTION: ${{ steps.distributions.outputs.codex_wheel }}
        run: |
          mkdir -p "$HOME"
          uvx --from "$DISTRIBUTION" orchestrated-codex --install --all
          test -f "$HOME/.agents/skills/orchestrated-delivery/SKILL.md"
          test -f "$CODEX_HOME/agents/developer.toml"
          uvx --from "$DISTRIBUTION" orchestrated-codex --uninstall
          test ! -e "$HOME/.agents/skills/orchestrated-delivery/SKILL.md"
          test ! -e "$CODEX_HOME/codex-orchestrator-install.json"

      - name: Smoke test the Codex source distribution
        env:
          HOME: ${{ runner.temp }}/smoke-codex-sdist/home
          CODEX_HOME: ${{ runner.temp }}/smoke-codex-sdist/codex-home
          UV_CACHE_DIR: ${{ runner.temp }}/smoke-codex-sdist/uv-cache
          DISTRIBUTION: ${{ steps.distributions.outputs.codex_sdist }}
        run: |
          mkdir -p "$HOME"
          uvx --from "$DISTRIBUTION" orchestrated-codex --install --all
          test -f "$HOME/.agents/skills/orchestrated-delivery/SKILL.md"
          test -f "$CODEX_HOME/agents/developer.toml"
          uvx --from "$DISTRIBUTION" orchestrated-codex --uninstall
          test ! -e "$HOME/.agents/skills/orchestrated-delivery/SKILL.md"
          test ! -e "$CODEX_HOME/codex-orchestrator-install.json"

      - name: Smoke test the Claude wheel
        env:
          HOME: ${{ runner.temp }}/smoke-claude-wheel/home
          UV_CACHE_DIR: ${{ runner.temp }}/smoke-claude-wheel/uv-cache
          DISTRIBUTION: ${{ steps.distributions.outputs.claude_wheel }}
        run: |
          mkdir -p "$HOME"
          uvx --from "$DISTRIBUTION" orchestrated-claude --install --all
          test -f "$HOME/.claude/skills/orchestrated-delivery/SKILL.md"
          test -f "$HOME/.claude/agents/developer.md"
          uvx --from "$DISTRIBUTION" orchestrated-claude --uninstall
          test ! -e "$HOME/.claude/skills/orchestrated-delivery/SKILL.md"
          test ! -e "$HOME/.claude/claude-orchestrator-install.json"

      - name: Smoke test the Claude source distribution
        env:
          HOME: ${{ runner.temp }}/smoke-claude-sdist/home
          UV_CACHE_DIR: ${{ runner.temp }}/smoke-claude-sdist/uv-cache
          DISTRIBUTION: ${{ steps.distributions.outputs.claude_sdist }}
        run: |
          mkdir -p "$HOME"
          uvx --from "$DISTRIBUTION" orchestrated-claude --install --all
          test -f "$HOME/.claude/skills/orchestrated-delivery/SKILL.md"
          test -f "$HOME/.claude/agents/developer.md"
          uvx --from "$DISTRIBUTION" orchestrated-claude --uninstall
          test ! -e "$HOME/.claude/skills/orchestrated-delivery/SKILL.md"
          test ! -e "$HOME/.claude/claude-orchestrator-install.json"

      - name: Upload Codex distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-distributions
          path: |
            dist/codex/*.whl
            dist/codex/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload Claude distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-distributions
          path: |
            dist/claude/*.whl
            dist/claude/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/orchestrated-codex
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-claude:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi-claude
      url: https://pypi.org/p/orchestrated-claude
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claude-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/orchestrated-claude
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-distributions"
          merge-multiple: true
          path: dist/

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
