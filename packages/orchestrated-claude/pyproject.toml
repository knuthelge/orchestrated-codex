[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[project]
name = "orchestrated-claude"
version = "0.1.13"
description = "Install Claude Code delivery and code-review skills with focused custom agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prompt-toolkit>=3.0.52,<4",
    "PyYAML>=6.0.3,<7",
    "questionary>=2.1.1,<3",
]
keywords = ["claude", "claude-code", "orchestration", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
orchestrated-claude = "claude_orchestrator.cli:main"

[tool.uv.build-backend]
module-name = "claude_orchestrator"
module-root = "src"
