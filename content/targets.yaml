# Per-harness vocabulary and package metadata for scripts/export.py. Templates under content/ read
# these values; an unknown key fails the render.
codex:
  package:
    module: codex_orchestrator
    description: Install Codex delivery and code-review skills with focused custom agents.
    keywords: [codex, orchestration, developer-tools]
  product: Codex
  invoke: "$"
  ask_user: a structured user question
  agent_format: codex
  agent_name_style: snake
  agent_ext: .toml
  tiers:
    deep: gpt-6-sol
    standard: gpt-5.6-terra
    fast: gpt-6-luna
  skills:
    code_review: orchestrated-code-review

claude:
  package:
    module: claude_orchestrator
    description: Install Claude Code delivery and code-review skills with focused custom agents.
    keywords: [claude, claude-code, orchestration, developer-tools]
  product: Claude Code
  invoke: "/"
  ask_user: a structured user question (the AskUserQuestion tool)
  agent_format: claude
  agent_name_style: kebab
  agent_ext: .md
  tiers:
    deep: opus
    standard: sonnet
    fast: haiku
  skills:
    code_review: orchestrated-code-review
