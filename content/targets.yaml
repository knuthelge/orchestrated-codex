# Per-harness vocabulary for scripts/render_resources.py. Templates under content/ read
# these values; an unknown key fails the render.
codex:
  output: src/codex_orchestrator/resources
  product: Codex
  invoke: "$"
  ask_user: a structured user question
  agent_format: codex
  agent_name_style: snake
  agent_ext: .toml
  tiers:
    deep: gpt-6-sol
    standard: gpt-5.6-terra
    fast: gpt-6-luna
  skills:
    code_review: orchestrated-code-review

claude:
  output: packages/orchestrated-claude/src/claude_orchestrator/resources
  engine_mirror: packages/orchestrated-claude/src/claude_orchestrator
  readme_mirror: packages/orchestrated-claude/README.md
  product: Claude Code
  invoke: "/"
  ask_user: a structured user question (the AskUserQuestion tool)
  agent_format: claude
  agent_name_style: kebab
  agent_ext: .md
  tiers:
    deep: opus
    standard: sonnet
    fast: haiku
  skills:
    code_review: orchestrated-code-review
