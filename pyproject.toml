[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

# The one codebase behind both consumer packages. It is never published itself:
# scripts/export.py exports orchestrated-codex and orchestrated-claude from it, taking
# their version, dependencies, and classifiers from this file.
[project]
name = "orchestrated"
version = "0.1.15"
description = "Orchestrated delivery skills and subagents for Codex and Claude Code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prompt-toolkit>=3.0.52,<4",
    "PyYAML>=6.0.3,<7",
    "questionary>=2.1.1,<3",
]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[tool.uv.build-backend]
module-name = "orchestrated"
module-root = "src"

[dependency-groups]
dev = [
    "jinja2>=3.1.6,<4",
]
